[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lidl-slevy"
version = "1.0.0"
description = "Lokální hlídač nových slev Lidl.cz"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lidl-slevy = "lidl_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
